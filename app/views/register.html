
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Register - Alzikrayat</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body class="bg-light">

    <nav class="navbar navbar-expand-lg bg-dark navbar-dark">

        <div class="container">

            <a
                class="navbar-brand"
                href="/"
            >
                Alzikrayat
            </a>

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#mainNavbar"
                aria-controls="mainNavbar"
                aria-expanded="false"
                aria-label="Toggle navigation"
            >

                <span class="navbar-toggler-icon"></span>

            </button>

            <div
                class="collapse navbar-collapse"
                id="mainNavbar"
            >

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a
                            class="nav-link"
                            href="/"
                        >
                            Home
                        </a>
                    </li>

                    <li class="nav-item">
                        <a
                            class="nav-link"
                            href="/photos"
                        >
                            Photos
                        </a>
                    </li>

                    <li class="nav-item">
                        <a
                            class="nav-link"
                            href="/login"
                        >
                            Login
                        </a>
                    </li>

                </ul>

            </div>

        </div>

    </nav>


    <main class="container py-5">

        <div class="row justify-content-center">

            <div class="col-12 col-md-10 col-lg-7">

                <div class="card shadow-sm">

                    <div class="card-body p-4">

                        <h1 class="text-center mb-4">
                            Create Account
                        </h1>


                        <form
                            id="registerForm"
                            novalidate
                        >

                            <div class="row">

                                <div class="col-md-6 mb-3">

                                    <label
                                        for="firstName"
                                        class="form-label"
                                    >
                                        First Name
                                    </label>

                                    <input
                                        type="text"
                                        id="firstName"
                                        class="form-control"
                                        maxlength="50"
                                        pattern="[A-Za-z]+"
                                        required
                                        autocomplete="given-name"
                                    >

                                </div>


                                <div class="col-md-6 mb-3">

                                    <label
                                        for="lastName"
                                        class="form-label"
                                    >
                                        Last Name
                                    </label>

                                    <input
                                        type="text"
                                        id="lastName"
                                        class="form-control"
                                        maxlength="50"
                                        pattern="[A-Za-z]+"
                                        required
                                        autocomplete="family-name"
                                    >

                                </div>

                            </div>


                            <div class="mb-3">

                                <label
                                    for="email"
                                    class="form-label"
                                >
                                    Email
                                </label>

                                <input
                                    type="email"
                                    id="email"
                                    class="form-control"
                                    maxlength="255"
                                    required
                                    autocomplete="email"
                                >

                            </div>


                            <div class="mb-3">

                                <label
                                    for="password"
                                    class="form-label"
                                >
                                    Password
                                </label>

                                <input
                                    type="password"
                                    id="password"
                                    class="form-control"
                                    minlength="8"
                                    maxlength="128"
                                    required
                                    autocomplete="new-password"
                                >

                                <div class="form-text">
                                    Password must be between 8 and 128 characters.
                                </div>

                            </div>


                            <div class="mb-3">

                                <label
                                    for="location"
                                    class="form-label"
                                >
                                    Location
                                </label>

                                <input
                                    type="text"
                                    id="location"
                                    class="form-control"
                                    maxlength="255"
                                    autocomplete="address-level2"
                                >

                            </div>


                            <div class="mb-3">

                                <label
                                    for="description"
                                    class="form-label"
                                >
                                    Description
                                </label>

                                <textarea
                                    id="description"
                                    class="form-control"
                                    maxlength="1000"
                                    rows="4"
                                ></textarea>

                            </div>


                            <div class="mb-3">

                                <label
                                    for="occupation"
                                    class="form-label"
                                >
                                    Occupation
                                </label>

                                <input
                                    type="text"
                                    id="occupation"
                                    class="form-control"
                                    maxlength="255"
                                >

                            </div>


                            <button
                                id="registerButton"
                                type="submit"
                                class="btn btn-primary w-100"
                            >
                                Register
                            </button>

                        </form>


                        <div
                            id="message"
                            class="mt-3"
                            role="alert"
                        ></div>


                        <p class="text-center mt-4 mb-0">

                            Already have an account?

                            <a href="/login">
                                Login
                            </a>

                        </p>

                    </div>

                </div>

            </div>

        </div>

    </main>


    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>


    <script>

        /**
         * Handles user registration form submission and client-side validation.
         */
        document
            .getElementById("registerForm")
            .addEventListener(
                "submit",
                async function(event) {

                    event.preventDefault();


                    const firstNameInput =
                        document.getElementById(
                            "firstName"
                        );

                    const lastNameInput =
                        document.getElementById(
                            "lastName"
                        );

                    const emailInput =
                        document.getElementById(
                            "email"
                        );

                    const passwordInput =
                        document.getElementById(
                            "password"
                        );

                    const locationInput =
                        document.getElementById(
                            "location"
                        );

                    const descriptionInput =
                        document.getElementById(
                            "description"
                        );

                    const occupationInput =
                        document.getElementById(
                            "occupation"
                        );

                    const message =
                        document.getElementById(
                            "message"
                        );

                    const registerButton =
                        document.getElementById(
                            "registerButton"
                        );


                    const firstName =
                        firstNameInput.value.trim();

                    const lastName =
                        lastNameInput.value.trim();

                    const email =
                        emailInput.value.trim();

                    const password =
                        passwordInput.value;

                    const location =
                        locationInput.value.trim();

                    const description =
                        descriptionInput.value.trim();

                    const occupation =
                        occupationInput.value.trim();


                    const namePattern =
                        /^[A-Za-z]+$/;

                    const emailPattern =
                        /^[^@\s]+@[^@\s]+\.[^@\s]+$/;


                    message.className =
                        "mt-3";

                    message.textContent =
                        "";


                    if (
                        !firstName ||
                        firstName.length > 50 ||
                        !namePattern.test(firstName)
                    ) {

                        message.className =
                            "alert alert-danger mt-3";

                        message.textContent =
                            "First name must contain letters only and must not exceed 50 characters.";

                        firstNameInput.focus();

                        return;
                    }


                    if (
                        !lastName ||
                        lastName.length > 50 ||
                        !namePattern.test(lastName)
                    ) {

                        message.className =
                            "alert alert-danger mt-3";

                        message.textContent =
                            "Last name must contain letters only and must not exceed 50 characters.";

                        lastNameInput.focus();

                        return;
                    }


                    if (
                        !email ||
                        email.length > 255 ||
                        !emailPattern.test(email)
                    ) {

                        message.className =
                            "alert alert-danger mt-3";

                        message.textContent =
                            "Please enter a valid email address.";

                        emailInput.focus();

                        return;
                    }


                    if (
                        password.length < 8 ||
                        password.length > 128
                    ) {

                        message.className =
                            "alert alert-danger mt-3";

                        message.textContent =
                            "Password must be between 8 and 128 characters.";

                        passwordInput.focus();

                        return;
                    }


                    if (location.length > 255) {

                        message.className =
                            "alert alert-danger mt-3";

                        message.textContent =
                            "Location must not exceed 255 characters.";

                        locationInput.focus();

                        return;
                    }


                    if (description.length > 1000) {

                        message.className =
                            "alert alert-danger mt-3";

                        message.textContent =
                            "Description must not exceed 1000 characters.";

                        descriptionInput.focus();

                        return;
                    }


                    if (occupation.length > 255) {

                        message.className =
                            "alert alert-danger mt-3";

                        message.textContent =
                            "Occupation must not exceed 255 characters.";

                        occupationInput.focus();

                        return;
                    }


                    const data = {

                        firstName: firstName,

                        lastName: lastName,

                        email: email,

                        password: password,

                        location: location,

                        description: description,

                        occupation: occupation

                    };


                    registerButton.disabled = true;

                    registerButton.textContent =
                        "Creating Account...";


                    try {

                        const response =
                            await fetch(
                                "/register",
                                {
                                    method: "POST",

                                    headers: {
                                        "Content-Type":
                                            "application/json",

                                        "X-CSRF-Token":
                                            "{{ csrfToken }}"
                                    },

                                    body: JSON.stringify(
                                        data
                                    )
                                }
                            );


                        const result =
                            await response.json();


                        if (!response.ok) {

                            message.className =
                                "alert alert-danger mt-3";

                            message.textContent =
                                result.error ||
                                "Registration failed.";

                            return;
                        }


                        message.className =
                            "alert alert-success mt-3";

                        message.textContent =
                            result.message ||
                            "Registration successful.";


                        document
                            .getElementById(
                                "registerForm"
                            )
                            .reset();


                        setTimeout(
                            function() {

                                window.location.href =
                                    "/login";

                            },
                            1000
                        );


                    } catch (error) {

                        message.className =
                            "alert alert-danger mt-3";

                        message.textContent =
                            "An error occurred. Please try again.";

                    } finally {

                        registerButton.disabled = false;

                        registerButton.textContent =
                            "Register";

                    }

                }
            );

    </script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Photo - Alzikrayat</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">Alzikrayat</a>

        <div>
            <a class="btn btn-outline-light me-2" href="/">Home</a>
            <a class="btn btn-outline-light" href="/photos">Photos</a>
        </div>
    </div>
</nav>

<div class="container mt-5">

    <h2 class="mb-4">Upload Photo</h2>

    <form id="uploadForm">

        <div class="mb-3">
            <label for="photo" class="form-label">Choose Photo</label>

            <input
                type="file"
                class="form-control"
                id="photo"
                name="photo"
                accept=".jpg,.jpeg,.png,.gif,.webp,image/jpeg,image/png,image/gif,image/webp"
                required
            >

            <div class="form-text">
                Allowed types: JPG, JPEG, PNG, GIF, WEBP. Maximum size: 5 MB.
            </div>
        </div>

        <div class="mb-3">
            <label for="title" class="form-label">Photo Title</label>

            <input
                type="text"
                class="form-control"
                id="title"
                name="title"
                maxlength="200"
                required>

            <div class="form-text">
                Maximum 200 characters.
                <span id="titleCounter">0/200</span>
            </div>
        </div>

        <div class="mb-3">
            <label for="description" class="form-label">Description</label>

            <textarea
                class="form-control"
                id="description"
                name="description"
                maxlength="1000"
                rows="4"
            ></textarea>

            <div class="form-text">
                Maximum 1000 characters.
                <span id="descriptionCounter">0/1000</span>
            </div>
        </div>

        <button type="submit" class="btn btn-primary">
            Upload
        </button>

    </form>

    <div id="result" class="mt-3"></div>

</div>

<script>

const uploadForm = document.getElementById("uploadForm");

const photoInput = document.getElementById("photo");
const titleInput = document.getElementById("title");
const descriptionInput = document.getElementById("description");

const titleCounter = document.getElementById("titleCounter");
const descriptionCounter = document.getElementById("descriptionCounter");

const result = document.getElementById("result");


// Update title character counter
titleInput.addEventListener("input", function () {

    titleCounter.textContent = `${titleInput.value.length}/200`;

});


// Update description character counter
descriptionInput.addEventListener("input", function () {

    descriptionCounter.textContent = `${descriptionInput.value.length}/1000`;

});


uploadForm.addEventListener("submit", async function(event) {

    event.preventDefault();

    const photo = photoInput.files[0];
    const title = titleInput.value.trim();
    const description = descriptionInput.value.trim();


    const allowedTypes = [
        "image/jpeg",
        "image/png",
        "image/gif",
        "image/webp"
    ];


    // Check photo
    if (!photo) {

        result.innerHTML =
            '<div class="alert alert-danger">Please choose a photo.</div>';

        return;
    }


    // Check file type
    if (!allowedTypes.includes(photo.type)) {

        result.innerHTML =
            '<div class="alert alert-danger">Only JPG, JPEG, PNG, GIF, and WEBP files are allowed.</div>';

        return;
    }


    // Check file size
    const maxSize = 5 * 1024 * 1024;

    if (photo.size > maxSize) {

        result.innerHTML =
            '<div class="alert alert-danger">File size must not exceed 5 MB.</div>';

        return;
    }


    // Check title
    if (!title) {

        result.innerHTML =
            '<div class="alert alert-danger">Photo title is required.</div>';

        return;
    }


    // Check title length
    if (title.length > 200) {

        result.innerHTML =
            '<div class="alert alert-danger">Photo title must not exceed 200 characters.</div>';

        return;
    }


    // Check description length
    if (description.length > 1000) {

        result.innerHTML =
            '<div class="alert alert-danger">Description must not exceed 1000 characters.</div>';

        return;
    }


    const formData = new FormData();

    formData.append("photo", photo);
    formData.append("title", title);
    formData.append("description", description);


    try {

        const response = await fetch("/upload", {
            method: "POST",
            body: formData
        });


        const data = await response.json();


        if (response.ok) {

            result.innerHTML =
                '<div class="alert alert-success">' +
                data.message +
                '</div>';

            uploadForm.reset();

            titleCounter.textContent = "0/200";
            descriptionCounter.textContent = "0/1000";

        } else {

            result.innerHTML =
                '<div class="alert alert-danger">' +
                (data.error || "Upload failed.") +
                '</div>';

        }

    } catch (error) {

        result.innerHTML =
            '<div class="alert alert-danger">' +
            'An error occurred while uploading the photo.' +
            '</div>';

    }

});

</script>

</body>
</html>

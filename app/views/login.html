
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - Alzikrayat</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body class="bg-light">

    <nav class="navbar navbar-expand-lg bg-dark navbar-dark">

        <div class="container">

            <a
                class="navbar-brand"
                href="/"
            >
                Alzikrayat
            </a>

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#mainNavbar"
                aria-controls="mainNavbar"
                aria-expanded="false"
                aria-label="Toggle navigation"
            >

                <span class="navbar-toggler-icon"></span>

            </button>

            <div
                class="collapse navbar-collapse"
                id="mainNavbar"
            >

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a
                            class="nav-link"
                            href="/"
                        >
                            Home
                        </a>
                    </li>

                    <li class="nav-item">
                        <a
                            class="nav-link"
                            href="/photos"
                        >
                            Photos
                        </a>
                    </li>

                    <li class="nav-item">
                        <a
                            class="nav-link"
                            href="/register"
                        >
                            Register
                        </a>
                    </li>

                </ul>

            </div>

        </div>

    </nav>


    <main class="container py-5">

        <div class="row justify-content-center">

            <div class="col-12 col-md-8 col-lg-5">

                <div class="card shadow-sm">

                    <div class="card-body p-4">

                        <h1 class="text-center mb-4">
                            Login
                        </h1>


                        {% if lastLogin %}

                        <div class="alert alert-info">

                            Last login from this computer was
                            {{ lastLogin }}

                        </div>

                        {% endif %}


                        <form
                            id="loginForm"
                            novalidate
                        >

                            <div class="mb-3">

                                <label
                                    for="email"
                                    class="form-label"
                                >
                                    Email
                                </label>

                                <input
                                    type="email"
                                    id="email"
                                    class="form-control"
                                    maxlength="255"
                                    required
                                    autocomplete="email"
                                >

                                <div
                                    id="emailError"
                                    class="invalid-feedback"
                                ></div>

                            </div>


                            <div class="mb-3">

                                <label
                                    for="password"
                                    class="form-label"
                                >
                                    Password
                                </label>

                                <input
                                    type="password"
                                    id="password"
                                    class="form-control"
                                    minlength="8"
                                    maxlength="128"
                                    required
                                    autocomplete="current-password"
                                >

                                <div
                                    id="passwordError"
                                    class="invalid-feedback"
                                ></div>

                            </div>


                            <button
                                id="loginButton"
                                type="submit"
                                class="btn btn-primary w-100"
                            >
                                Login
                            </button>

                        </form>


                        <div
                            id="message"
                            class="mt-3"
                            role="alert"
                        ></div>


                        <p class="text-center mt-4 mb-0">

                            Don't have an account?

                            <a href="/register">
                                Register
                            </a>

                        </p>

                    </div>

                </div>

            </div>

        </div>

    </main>


    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>


    <script>

        /**
         * Handles user login form submission and client-side validation.
         */
        document
            .getElementById("loginForm")
            .addEventListener(
                "submit",
                async function(event) {

                    event.preventDefault();


                    const emailInput =
                        document.getElementById(
                            "email"
                        );

                    const passwordInput =
                        document.getElementById(
                            "password"
                        );

                    const message =
                        document.getElementById(
                            "message"
                        );

                    const loginButton =
                        document.getElementById(
                            "loginButton"
                        );


                    const email =
                        emailInput.value.trim();

                    const password =
                        passwordInput.value;


                    const emailPattern =
                        /^[^@\s]+@[^@\s]+\.[^@\s]+$/;


                    emailInput.classList.remove(
                        "is-invalid"
                    );

                    passwordInput.classList.remove(
                        "is-invalid"
                    );

                    message.className = "mt-3";

                    message.textContent = "";


                    if (!email) {

                        emailInput.classList.add(
                            "is-invalid"
                        );

                        message.className =
                            "alert alert-danger mt-3";

                        message.textContent =
                            "Email is required.";

                        return;
                    }


                    if (
                        email.length > 255 ||
                        !emailPattern.test(email)
                    ) {

                        emailInput.classList.add(
                            "is-invalid"
                        );

                        message.className =
                            "alert alert-danger mt-3";

                        message.textContent =
                            "Please enter a valid email address.";

                        return;
                    }


                    if (!password) {

                        passwordInput.classList.add(
                            "is-invalid"
                        );

                        message.className =
                            "alert alert-danger mt-3";

                        message.textContent =
                            "Password is required.";

                        return;
                    }


                    if (password.length < 8) {

                        passwordInput.classList.add(
                            "is-invalid"
                        );

                        message.className =
                            "alert alert-danger mt-3";

                        message.textContent =
                            "Password must be at least 8 characters.";

                        return;
                    }


                    if (password.length > 128) {

                        passwordInput.classList.add(
                            "is-invalid"
                        );

                        message.className =
                            "alert alert-danger mt-3";

                        message.textContent =
                            "Password must not exceed 128 characters.";

                        return;
                    }


                    loginButton.disabled = true;

                    loginButton.textContent =
                        "Logging in...";


                    try {

                        const response =
                            await fetch(
                                "/login",
                                {
                                    method: "POST",

                                    headers: {
                                        "Content-Type":
                                            "application/json",

                                        "X-CSRF-Token":
                                            "{{ csrfToken }}"
                                    },

                                    body: JSON.stringify({
                                        email: email,
                                        password: password
                                    })
                                }
                            );


                        const result =
                            await response.json();


                        if (!response.ok) {

                            message.className =
                                "alert alert-danger mt-3";

                            message.textContent =
                                result.error ||
                                "Login failed.";

                            return;
                        }


                        message.className =
                            "alert alert-success mt-3";

                        message.textContent =
                            result.message ||
                            "Login successful.";


                        setTimeout(
                            function() {

                                window.location.href =
                                    "/";

                            },
                            500
                        );


                    } catch (error) {

                        message.className =
                            "alert alert-danger mt-3";

                        message.textContent =
                            "An error occurred. Please try again.";

                    } finally {

                        loginButton.disabled = false;

                        loginButton.textContent =
                            "Login";

                    }

                }
            );

    </script>

</body>

</html>
